<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识速查手册 · 模块库与五类样板（原型）</title>
<style>
:root{
  --bg:#ffffff; --bg-2:#f7f7f5; --bg-3:#efefec;
  --ink:#1a1a1a; --ink-2:#4a4a4a; --ink-3:#8a8a8a;
  --rule:#e6e6e3; --rule-2:#f1f1ee;
  --accent:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#6d28d9;
  /* 语义底色：此前只有语义前景色，且只被原型自身的调试外壳使用，内容层加不了浅底 */
  --accent-bg:#eef3fe; --ok-bg:#e9f6ee; --warn-bg:#fdf4e4; --bad-bg:#fdecec; --info-bg:#f3eefe;
  /* 字号分档：此前内容字号全挤在 13–14.5px，一屏等重 */
  --f-xs:12px; --f-s:13.5px; --f-m:14.5px; --f-t:15px; --f-l:17px; --f-xl:20px;
  --r-s:4px; --r-m:8px; --r-l:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
[data-mode="dark"]{
  --bg:#131313; --bg-2:#1b1b1b; --bg-3:#232323;
  --ink:#ececec; --ink-2:#b0b0b0; --ink-3:#787878;
  --rule:#2f2f2f; --rule-2:#242424;
  --accent:#7cb0ff; --ok:#5fd08a; --warn:#f0b45c; --bad:#f08c8c; --info:#b39df5;
  --accent-bg:#1a2438; --ok-bg:#15271c; --warn-bg:#2c2213; --bad-bg:#2c1717; --info-bg:#231c35;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.75 var(--font);scroll-behavior:smooth}
h1,h2,h3,h4,h5{margin:0;font-weight:600;line-height:1.4}
p{margin:.35em 0}
a{color:var(--accent);text-decoration:none}
code,.mono{font-family:var(--mono);font-size:.9em}

/* ---------- 外壳 ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:52px;background:var(--bg);border-bottom:1px solid var(--rule)}
.brand{font-weight:600;font-size:14.5px;letter-spacing:.02em;white-space:nowrap}
.brand em{font-style:normal;color:var(--ink-3);font-weight:400}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.tools input{font:inherit;font-size:13.5px;padding:5px 10px;width:210px;color:var(--ink);
  background:var(--bg-2);border:1px solid var(--rule);border-radius:var(--r-m)}
.tools input:focus{outline:none;border-color:var(--accent)}
.btn{font:inherit;font-size:13.5px;padding:5px 12px;color:var(--ink-2);background:var(--bg);
  border:1px solid var(--rule);border-radius:var(--r-m);cursor:pointer}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{position:sticky;top:52px;z-index:29;display:flex;gap:4px;overflow-x:auto;
  padding:8px 20px;background:var(--bg-2);border-bottom:1px solid var(--rule)}
.tab{flex:none;font:inherit;font-size:13.5px;padding:6px 14px;color:var(--ink-2);background:transparent;
  border:1px solid transparent;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--bg);border-color:var(--rule);color:var(--ink);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:28px 20px 96px}

/* ---------- 模块库 ---------- */
.libbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px;
  padding:14px 16px;background:var(--bg-2);border:1px solid var(--rule);border-radius:var(--r-l)}
.libbar .lead{width:100%;font-size:13px;color:var(--ink-3);margin-bottom:4px}
.fam{margin:0 0 34px}
.fam>h2{display:flex;align-items:center;gap:9px;font-size:15px;padding-bottom:8px;margin-bottom:14px;
  border-bottom:1px solid var(--rule)}
.famkey{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  font:600 12px/1 var(--mono);color:var(--bg);background:var(--ink);border-radius:var(--r-s)}
.fam .cnt{font-size:12px;color:var(--ink-3);font-weight:400}
.mod{padding:14px 16px;margin-bottom:10px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-l)}
.mod-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.mid{font:600 11.5px/1 var(--mono);color:var(--accent);background:var(--bg-2);
  padding:4px 6px;border-radius:var(--r-s);border:1px solid var(--rule)}
.mod-head h3{font-size:15px}
.when{margin-left:auto;font-size:12px;color:var(--ink-3)}
.what{margin:6px 0 10px;font-size:13.5px;color:var(--ink-3)}
.sample{padding:12px 14px;background:var(--bg-2);border:1px dashed var(--rule);border-radius:var(--r-m)}

/* ---------- 样板页 ---------- */
.skhead{padding:20px 22px;margin-bottom:24px;background:var(--bg-2);border:1px solid var(--rule);border-radius:var(--r-l)}
.sktype{display:inline-block;font-size:12px;color:var(--accent);border:1px solid currentColor;
  border-radius:999px;padding:2px 10px;margin-bottom:8px}
.skhead h2{font-size:21px}
.skhead p{color:var(--ink-3);font-size:13.5px}
.skhead .chips{margin-top:12px}
.sksec{padding:18px 0 20px;border-top:1px solid var(--rule)}
.sksec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.sksec-head h3{font-size:16.5px}
.sksec-head .ord{margin-left:auto;font:400 12px/1 var(--mono);color:var(--ink-3)}
.sksec-body{font-size:14.5px}

/* ---------- 样例零件 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:var(--f-xs);padding:2px 9px;color:var(--ink-2);background:var(--bg);
  border:1px solid var(--rule);border-radius:999px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.bullets{margin:.3em 0;padding-left:1.15em;color:var(--ink-2);font-size:var(--f-m)}
.bullets li{margin:.28em 0}
.checklist{list-style:none;margin:.3em 0;padding:0;font-size:var(--f-m);color:var(--ink-2)}
.checklist li{position:relative;padding-left:24px;margin:.32em 0}
.checklist li::before{content:"";position:absolute;left:0;top:.42em;width:13px;height:13px;
  border:1.4px solid var(--ink-3);border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mini{padding:11px 13px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-m)}
.mini h4{font-size:var(--f-t);margin-bottom:3px}
.mini p{font-size:var(--f-s);color:var(--ink-3)}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 150px;padding:11px 13px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-m)}
.stat b{display:block;font:600 var(--f-xl)/1.2 var(--mono);color:var(--accent)}
.stat span{font-size:var(--f-xs);color:var(--ink-3)}
/* 对置：左右两栏、中缝分隔。A6 边界声明 / C4 易混淆辨析 / D5 流派对比 / F6 权衡对比 / G6 对比表 共用 */
.opposed{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:.35em 0;
  border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.opposed.three{grid-template-columns:repeat(3,1fr)}
.opposed>div{padding:11px 14px;background:var(--bg)}
.opposed>div+div{border-left:1px solid var(--rule)}
.opposed h5{font-size:var(--f-xs);font-weight:600;color:var(--ink-3);margin-bottom:6px}
.opposed p{font-size:var(--f-m);color:var(--ink-2);margin:0}
.opposed ul{margin:0}
.opposed .verdict{grid-column:1/-1;border-left:none;border-top:1px solid var(--rule);
  font-size:var(--f-s);color:var(--ink-3)}
table.mini{width:100%;border-collapse:collapse;font-size:var(--f-s)}
table.mini th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:left;padding:6px 10px;
  border-bottom:1px solid var(--rule)}
table.mini td{padding:7px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top}
table.mini tr:last-child td{border-bottom:none}
.steps,.tl{margin:.3em 0;padding-left:1.3em;font-size:var(--f-m);color:var(--ink-2)}
.steps li{margin:.3em 0}
.steps li::marker{font-family:var(--mono);color:var(--accent);font-weight:600}
/* 层级：缩进 + 连接线。B2 知识树 / B6 决策树 / E2 判断分支 共用 */
.tree{list-style:none;margin:.3em 0;padding-left:0;font-size:var(--f-m);color:var(--ink-2)}
.tree li{margin:.28em 0}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px solid var(--rule)}
.tree ul>li{position:relative}
.tree ul>li::before{content:"";position:absolute;left:-18px;top:.9em;width:13px;height:1px;background:var(--rule)}
.tiers{display:grid;gap:8px}
.tier{display:flex;gap:12px;align-items:baseline;padding:10px 13px;background:var(--bg);
  border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:var(--r-m)}
.tier .lv{flex:none;font:600 var(--f-xs)/1.6 var(--mono);color:var(--accent);min-width:38px}
.tier p{font-size:var(--f-m);color:var(--ink-2);margin:0}
.flow,.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:var(--f-s)}
.flow span,.chain span{padding:5px 11px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-m)}
.flow i,.chain i{color:var(--ink-3);font-style:normal}
.mapbox{position:relative;padding:26px 18px;text-align:center;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-l)}
.mapcenter{display:inline-block;padding:8px 20px;font-weight:600;color:var(--bg);background:var(--ink);border-radius:999px}
.mapring{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:14px}
.mapring span{font-size:var(--f-xs);padding:4px 11px;color:var(--ink-2);background:var(--bg-2);
  border:1px solid var(--rule);border-radius:999px}
.term{padding:12px 14px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-m)}
.term-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.term-h b{font-size:var(--f-t)}
.term .en{font:var(--f-xs)/1.4 var(--mono);color:var(--ink-3)}
.term p{font-size:var(--f-m);color:var(--ink-2);margin:.4em 0 0}
.term .fl{display:block;font-size:var(--f-xs);color:var(--ink-3);margin-bottom:1px}
.alias{font-size:var(--f-xs);color:var(--ink-3)}
.formula{padding:11px 14px;font:var(--f-m)/1.6 var(--mono);color:var(--ink);
  background:var(--bg);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:var(--r-m)}
.tl{list-style:none;padding:0;border-left:2px solid var(--rule);margin-left:6px}
.tl li{position:relative;padding:0 0 12px 16px;font-size:var(--f-m)}
.tl li::before{content:"";position:absolute;left:-7px;top:.5em;width:8px;height:8px;
  background:var(--accent);border-radius:50%}
.tl .yr{font:600 var(--f-xs)/1.6 var(--mono);color:var(--accent);margin-right:8px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr 62px;align-items:center;gap:10px;font-size:var(--f-s)}
.bar .tk{color:var(--ink-2)}
.bar .tr{height:8px;background:var(--bg-3);border-radius:999px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar .tv{font:var(--f-xs)/1 var(--mono);color:var(--ink-3);text-align:right}
.note{font-size:var(--f-xs);color:var(--ink-3);border-left:2px solid var(--rule);padding-left:10px}

/* ---------- 呈现原型：材质三档 + 四类固定形态 ---------- */
/* 材质一 · 平：不用外框与底色，只靠分隔线；给高密度表（G2 条目表 / H1 数值参考表 / E7 速查表） */
.mat-flat{background:transparent;border:none;border-radius:0}
/* 材质二 · 卡：默认形态（.mini / .term / .stat / .tier），保持现状 */
/* 材质三 · 浮：浅底 + 左侧色带 + 更宽留白；给结论与警示（A2 摘要 / A3 陈述 / D6 事件卡 / F2 反例） */
.mat-float{padding:14px 18px;background:var(--bg-2);border:none;border-left:3px solid var(--accent);
  border-radius:0 var(--r-m) var(--r-m) 0;line-height:1.8}
.mat-float>h4{font-size:var(--f-l);margin-bottom:5px}
.mat-float p{font-size:var(--f-m);color:var(--ink-2)}
.mat-float.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.mat-float.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.mat-float.ok{border-left-color:var(--ok);background:var(--ok-bg)}
/* 状态胶囊：语义色第一次进入内容层；给 F4 共识状态 / F5 证据等级 / F1 判据结论 */
.pill{display:inline-block;font-size:var(--f-xs);line-height:1.65;padding:1px 9px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.pill.info{color:var(--info);background:var(--info-bg);border-color:var(--info)}
.pill.neutral{color:var(--ink-3);background:var(--bg-3);border-color:var(--rule)}
.pill.grade{font-family:var(--mono);font-weight:600;min-width:1.7em;text-align:center}
/* 阈值：刻度条上标出判据阈值；给 F1 判别标准 */
.scale{position:relative;display:block;height:7px;min-width:92px;background:var(--bg-3);border-radius:999px}
.scale u{position:absolute;top:0;bottom:0;left:0;background:var(--ok);opacity:.32;border-radius:999px}
.scale i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ok);border-radius:1px}
.scale i.over{background:var(--bad)}
table.mini td.scale-cell{width:34%}
.scale-cell .thrv{display:block;margin-top:5px;font-size:var(--f-xs);color:var(--ink-3)}
/* 纠错：上为常见说法（划去），下为更准确的理解；给 E8 常见误区 / F2 反例 */
.fix{padding:11px 13px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-m)}
.fix+.fix{margin-top:8px}
p.alias{font-size:var(--f-xs);color:var(--ink-3)}
.fix del{display:block;font-size:var(--f-m);color:var(--ink-3);
  text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.5px}
.fix ins{display:block;margin-top:6px;font-size:var(--f-m);color:var(--ink);text-decoration:none;
  background:var(--ok-bg);border-left:2px solid var(--ok);padding:5px 10px;
  border-radius:0 var(--r-s) var(--r-s) 0}
.fix .why{display:block;margin-top:6px;font-size:var(--f-xs);color:var(--ink-3)}
/* 折叠：答案默认收起；给 G5 常见问题 / I2 自测题库 */
.fold{margin:.35em 0;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.fold>summary{display:flex;gap:9px;align-items:baseline;padding:9px 13px;cursor:pointer;
  font-size:var(--f-m);color:var(--ink);list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"＋";flex:none;font:600 var(--f-xs)/1.7 var(--mono);color:var(--accent)}
.fold[open]>summary::before{content:"－"}
.fold>summary:hover{background:var(--bg-2)}
.fold .ans{padding:0 13px 12px 37px;font-size:var(--f-s);color:var(--ink-2)}
.fold .ans b{color:var(--ok)}
/* 口述形态：电梯陈述（A3）。用大字与引号与 A1「一句话定位」的普通段落区分开，避免同族同形 */
.spoken{position:relative;margin:.35em 0;padding:14px 18px 14px 34px;background:var(--bg-2);
  border-radius:var(--r-m);font-size:var(--f-l);line-height:1.7;color:var(--ink)}
.spoken::before{content:"「";position:absolute;left:12px;top:6px;font-size:26px;line-height:1;
  color:var(--accent);opacity:.45}
/* 呈现原型到模块的对照写在本文件模块库页首的图例里，模块自身不新增字段 */

/* ---------- 骨架规格：层归属徽标与校验 ---------- */
.lay{font:500 11px/1 var(--mono);padding:3px 7px;border-radius:var(--r-s);border:1px solid var(--rule);color:var(--ink-3);white-space:nowrap}
.lay.base-head{color:var(--accent);border-color:var(--accent)}
.lay.base-tail{color:var(--ok);border-color:var(--ok)}
.lay.attr{color:var(--info);border-color:var(--info)}
.spec{margin-top:12px;padding:10px 13px;background:var(--bg);border:1px solid var(--rule);
  border-radius:var(--r-m);font-size:12.5px;line-height:1.95;color:var(--ink-3)}
.spec b{color:var(--ink-2);font-weight:600}
.spec .ok{color:var(--ok)}
.spec .bad{color:var(--bad)}
.spec code{font-size:11.5px;color:var(--ink-2)}
.spec-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.spec-line strong{color:var(--ink-2)}
.spec-meta{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.spec-msg{margin:6px 0 0;padding-left:1.1em;color:var(--bad);font-size:12px}
@media (max-width:700px){
  .opposed,.opposed.three{grid-template-columns:1fr}
  .opposed>div+div{border-left:none;border-top:1px solid var(--rule)}
  .tools input{width:120px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">知识速查手册 <em>· 原型：全模块 + 五类样板</em></div>
  <div class="tools">
    <input id="q" type="search" placeholder="搜索模块（名称 / 编号）">
    <button class="btn" id="modeBtn">暗色</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="app"></main>

<script>
/* ============================================================
   1. 模块族定义
   ============================================================ */
const FAMILIES = {
  A:'定位与概览', B:'结构与地图', C:'概念与术语', D:'叙事与演化', E:'操作与执行',
  F:'判断与取舍', G:'检索与索引', H:'数据与量化', I:'学习与自测', J:'元信息与延伸'
};
const FAM_DESC = {
  A:'回答「这页是什么、给谁看、要不要读」', B:'回答「知识整体长什么样、我在哪」',
  C:'最小可复用的知识单元', D:'时间线、人物与因果',
  E:'把知识变成可执行动作', F:'怎么选、边界在哪、什么算错',
  G:'让内容找得到', H:'数字与表格承担的部分',
  I:'检验是否真的学会', J:'来源、时效、下一步去哪'
};

/* ============================================================
   2. 模块库（全量，宁可多不可少）
   ============================================================ */
const MODULES = [
/* ---------- A 定位与概览 ---------- */
{id:'A1',fam:'A',name:'一句话定位',when:'全类型',what:'用一两句说清这页讲什么、解决什么问题。开场第一段，决定读者要不要继续。',
 html:`<p class="ln"><strong>营养学</strong>研究食物中的营养素如何被人体吸收、代谢与利用，以及这种利用与健康、疾病之间的关系。</p>`},
{id:'A2',fam:'A',name:'一页纸摘要',when:'全类型',what:'把全页结论压成一屏，能独立阅读；读者只读这一块也应拿到主干。',
 html:`<div class="mat-float"><ul class="bullets"><li>能量平衡是体重变化的主变量，其余因素影响的是分布与效率。</li><li>三大宏量营养素供能不同：碳水 4、蛋白质 4、脂肪 9 kcal/g。</li><li>膳食纤维不供能，但显著影响血糖、血脂与肠道菌群。</li></ul></div>`},

{id:'C1',fam:'C',name:'核心理论与框架',when:'体系型 / 判断型',what:'给出这一领域最主要的几个模型，每个一段话讲清它解释什么、局限在哪。',

{id:'C2',fam:'C',name:'术语卡',when:'全类型',what:'字段与句式固定的最小知识单元：名称 / 英文 / 别名 / 一句话定义 / 展开 / 所属主题。每页自包含。',
 html:`<div class="term"><div class="term-h"><b>基础代谢率</b><span class="en">Basal Metabolic Rate, BMR</span></div><p><span class="fl">别名</span>静息代谢率 RMR（测量条件更宽松、数值略高，日常估算多用它）</p><p><span class="fl">一句话定义</span>静息状态下维持生命所需的最低能量消耗，约占日常总消耗的 60–70%。</p><p><span class="fl">展开</span>测量条件严格：隔夜禁食、完全静息、清醒且无活动，因此数值低于 RMR；临床与日常估算一般用 RMR 而非 BMR。</p><p class="alias">所属主题 · 能量代谢</p></div>`},
{id:'C3',fam:'C',name:'术语索引',when:'清单型 / 体系型',what:'全部术语的索引视图，支持按首字母与类别检索；回答「这门知识一共要认识多少个词」。',
 html:`<div class="chips"><span class="chip">BMR</span><span class="chip">TDEE</span><span class="chip">GI 升糖指数</span><span class="chip">DIAAS</span><span class="chip">膳食纤维</span><span class="chip">必需氨基酸</span><span class="chip">脂溶性维生素</span><span class="chip">食物热效应</span></div>`},
{id:'C4',fam:'C',name:'易混淆概念辨析',when:'全类型',what:'成对概念的边界与判别标准。与「常见误区」不同：误区针对外行偏见，辨析针对内部易混点。',
 html:`<div class="opposed"><div><h5>BMR 基础代谢率</h5><p>测量条件严格（隔夜禁食、完全静息），数值更低。</p></div><div><h5>RMR 静息代谢率</h5><p>测量条件宽松，日常估算用这个。</p></div><div class="verdict"><h5>怎么分</h5><p>差在测量条件，不在测量对象。</p></div></div><div class="opposed"><div><h5>GI 升糖指数</h5><p>只看升糖速度，不看吃了多少。</p></div><div><h5>GL 升糖负荷</h5><p>把实际摄入量算了进去。</p></div><div class="verdict"><h5>怎么分</h5><p>GI 是单位质量的性质，GL 才是这一餐的效应。</p></div></div><div class="opposed"><div><h5>缺乏</h5><p>已出现临床体征。</p></div><div><h5>不足</h5><p>只有生化指标偏低，没有临床体征。</p></div><div class="verdict"><h5>怎么分</h5><p>看有没有可观察到的症状。</p></div></div>`},

{id:'C6',fam:'C',name:'公式与原理',when:'量化度高的主题',what:'把可计算的公式单列，附变量含义与单位；公式混在正文里既难找也难核对。',

{id:'C7',fam:'C',name:'心智模型卡',when:'判断型 / 体系型',what:'可迁移的思考方式，配场景标签；回答「遇到新问题该用什么框架想」。',

 {id:'C4',h:'易混淆概念辨析',html:`<div class="opposed"><div><h5>BMR 基础代谢率</h5><p>测量条件严格（隔夜禁食、完全静息），数值更低。</p></div><div><h5>RMR 静息代谢率</h5><p>测量条件宽松，日常估算用这个。</p></div><div class="verdict"><h5>怎么分</h5><p>差在测量条件，不在测量对象。</p></div></div><div class="opposed"><div><h5>GI 升糖指数</h5><p>只看升糖速度，不看吃了多少。</p></div><div><h5>GL 升糖负荷</h5><p>把实际摄入量算了进去。</p></div><div class="verdict"><h5>怎么分</h5><p>GI 是单位质量的性质，GL 才是这一餐的效应。</p></div></div><div class="opposed"><div><h5>缺乏</h5><p>已出现临床体征。</p></div><div><h5>不足</h5><p>只有生化指标偏低，没有临床体征。</p></div><div class="verdict"><h5>怎么分</h5><p>看有没有可观察到的症状。</p></div></div>`},

{key:'liucheng', label:'流程型 · docker 使用手册', type:'流程型', title:'docker 使用手册',

 sections:[
 {id:'A1',h:'一句话定位',html:`<p class="ln"><strong>Docker</strong> 把应用和它的运行环境一起打包成镜像，用容器跑起来，解决「在我机器上能跑」的问题。</p>`},
 {id:'A2',h:'一页纸摘要',html:`<div class="mat-float"><ul class="bullets"><li>镜像是只读模板，容器是镜像的运行实例，两者不是一回事。</li><li>容器共享宿主机内核，启动快、开销小，但与宿主机的隔离强度低于虚拟机。</li><li>容器里的文件系统随容器销毁而消失，要留住数据必须挂卷。</li><li>镜像层是构建缓存的单位，改动一层会让它之后的所有层失效。</li></ul></div>`},
 {id:'A6',h:'边界声明',html:`<div class="opposed"><div><h5>这一页讲</h5><ul class="bullets"><li>镜像、容器、网络、卷的日常操作</li><li>Dockerfile 的常用写法与排错</li></ul></div><div><h5>这一页不讲</h5><ul class="bullets"><li>Kubernetes 等集群编排</li><li>镜像仓库运维与安全加固细节</li></ul></div></div>`},
 {id:'A7',h:'前置门槛清单',html:`<table class="mini"><tr><th>类别</th><th>硬前置（缺了读不懂）</th><th>软前置（缺了读不深）</th></tr><tr><td>概念</td><td>进程与端口、文件路径、环境变量</td><td>Linux 命名空间与 cgroup</td></tr><tr><td>学科</td><td>无——会命令行即可开始</td><td>操作系统与网络基础</td></tr><tr><td>通识</td><td>知道镜像 / 容器 / 仓库是三件不同的事</td><td>了解虚拟化与云服务的常见说法</td></tr><tr><td>工具</td><td>本机可运行 Docker，能用终端与编辑器</td><td>有一个镜像仓库账号</td></tr></table>`},
 {id:'B5',h:'流程图',html:`<div class="flow"><span>写 Dockerfile</span><i>→</i><span>docker build</span><i>→</i><span>docker run</span><i>→</i><span>进容器调试</span><i>→</i><span>push 到仓库</span></div>`},
 {id:'E1',h:'步骤流程',html:`<ol class="steps"><li><strong>写 Dockerfile</strong>：固定基础镜像版本，逐层加依赖</li><li><strong>构建镜像</strong>：<code>docker build -t name:tag .</code></li><li><strong>运行并验证</strong>：<code>docker run --rm -it name:tag</code></li><li><strong>调试</strong>：进容器看日志；必要时挂载卷复现问题</li><li><strong>发布</strong>：<code>docker push</code> 到仓库，固定 tag 不用 latest</li></ol>`},
 {id:'E2',h:'判断分支',html:`<ul class="tree"><li>容器起不来，先看什么？<ul><li>日志有报错 → 读最后 20 行</li><li>没有日志 → <code>docker ps -a</code> 看退出码</li><li>退出码 137 → 多半是被 OOM 杀掉</li></ul></li></ul>`},
 {id:'E7',h:'速查表',html:`<table class="mini mat-flat"><tr><th>命令</th><th>做什么</th></tr><tr><td><code>docker ps -a</code></td><td>列出所有容器，含已退出</td></tr><tr><td><code>docker logs -f &lt;id&gt;</code></td><td>持续跟踪容器日志</td></tr><tr><td><code>docker exec -it &lt;id&gt; sh</code></td><td>进入运行中的容器</td></tr><tr><td><code>docker system prune</code></td><td>清理悬空镜像与停止的容器</td></tr></table>`},
 {id:'E3',h:'检查清单',html:`<ul class="checklist"><li>基础镜像版本已固定，不用 <code>latest</code></li><li>.dockerignore 已排除 node_modules 与 .git</li><li>镜像内不含密钥，敏感值走环境变量</li><li>已确认容器内的时区与宿主机一致</li></ul>`},
 {id:'E4',h:'失败模式与常见错误',html:`<table class="mini"><tr><th>现象</th><th>原因</th><th>处理</th></tr><tr><td>镜像体积异常大</td><td>构建缓存与源码一起打进了层</td><td>多阶段构建 + .dockerignore</td></tr><tr><td>换台机器就跑不起来</td><td>依赖了宿主机的环境变量或路径</td><td>全部显式声明进镜像</td></tr><tr><td>数据随容器删除而丢失</td><td>没挂载卷</td><td>用 volume 或 bind mount 持久化</td></tr></table>`},
 {id:'E6',h:'工具与资源清单',html:`<table class="mini"><tr><th>用途</th><th>工具</th></tr><tr><td>本地编排</td><td>docker compose</td></tr><tr><td>镜像分层分析</td><td>dive</td></tr><tr><td>图形化管理</td><td>Docker Desktop / lazydocker</td></tr></table>`},
 {id:'G5',h:'常见问题 FAQ',html:`<details class="fold"><summary>容器和虚拟机有什么区别？</summary><div class="ans">容器共享宿主机内核，只隔离进程与文件系统；虚拟机各自跑一套内核。因此容器启动快、开销小，但隔离强度更低。</div></details><details class="fold"><summary>改了代码为什么容器里没变？</summary><div class="ans">镜像构建时就把代码复制进去了，必须重新 build；开发阶段可以用卷把本地目录挂进去。</div></details>`},
 {id:'J4',h:'时效与半衰期',html:`<table class="mini"><tr><th>字段</th><th>值</th></tr><tr><td>内容截止</td><td>2026-10（Docker Engine 27.x 前后）</td></tr><tr><td>更新速度</td><td>快：命令稳定，但 compose 与构建特性变化频繁</td></tr><tr><td>需要复核的部分</td><td>compose 文件版本写法、构建器（BuildKit）默认行为</td></tr></table>`},
 {id:'E8',h:'常见误区与陷阱',html:`<div class="fix"><del>「容器就是轻量虚拟机」</del><ins>容器共享宿主内核，隔离来自命名空间与 cgroup，不是硬件虚拟化。</ins><span class="why">错在哪：把隔离手段当成了隔离强度。</span></div><div class="fix"><del>「数据放进容器里就行」</del><ins>要留住的数据必须写在卷上。</ins><span class="why">错在哪：忽略了容器文件系统随容器销毁。</span></div><div class="fix"><del>「镜像越瘦越好」</del><ins>瘦身的前提是还能进容器排查问题，基础镜像按用途选。</ins><span class="why">错在哪：忽略了可排错性。</span></div>`},
 {id:'I1',h:'学习路线图',html:`<ul class="checklist"><li>跑通第一个容器（run / ps / logs）</li><li>会写 Dockerfile 并控制镜像体积</li><li>掌握卷与网络，能持久化数据、互联多容器</li><li>用 compose 编排本地多服务</li><li>理解构建缓存与多阶段构建</li></ul>`},
 {id:'I5',h:'学完能做什么',html:`<ul class="bullets"><li>能把一个本地项目写成 Dockerfile 并在本机跑起来。</li><li>能判断某份数据该放在卷里还是打进镜像里。</li><li>能读懂一份 compose 文件，并改出自己要的多服务编排。</li><li>能解释镜像体积为什么变大，并定位到是哪一层造成的。</li></ul>`},
 {id:'J9',h:'相关主题声明',html:`<table class="mini"><tr><th>主题</th><th>关系</th><th>为什么相关</th></tr><tr><td>Linux 命令行与权限</td><td>前置</td><td>容器内排错全在命令行里完成</td></tr><tr><td>docker compose 编排</td><td>后继</td><td>单容器跑通后最自然的下一步</td></tr><tr><td>虚拟机与虚拟化</td><td>并列</td><td>另一种隔离方案，可对照理解取舍</td></tr><tr><td>网络基础</td><td>跨学科</td><td>端口映射与容器互联依赖这套概念</td></tr><tr><td>Kubernetes</td><td>后继</td><td>容器规模上去之后必然遇到的问题域</td></tr></table>`},
 {id:'J10',h:'延伸问题',html:`<ul class="bullets"><li>容器里的「隔离」到底隔开了什么？<span class="note"> → Linux 命名空间与 cgroup</span></li><li>不装 Docker 也能跑容器吗？<span class="note"> → containerd / Podman 等运行时</span></li><li>多台机器上的容器怎么统一调度？<span class="note"> → 编排系统</span></li></ul>`},
 {id:'J5',h:'来源与参考',html:`<ul class="bullets"><li>Docker 官方文档与 CLI 参考</li><li>说明：命令行为以你本地 <code>docker version</code> 对应的文档为准</li></ul>`}
 ]},

/* ============ 3. 清单型 ============ */
{key:'qingdan', label:'清单型 · 体检指标参考值', type:'清单型', title:'常用体检指标参考值',
 sub:'骨架主体 = 分类索引 + 条目表 + 别名检索，不需要叙事线。共 21 节。三个层：头部基线 5 节、类型专属 10 节、尾部基线 6 节。',
 layers:{head:['A1','A2','A6','A5','A7'], tail:['E8','I1','I5','J9','J10','J5'], attr:{}},
 sections:[
 {id:'A1',h:'一句话定位',html:`<p class="ln">这一页把常见体检项目、参考区间、单位与主要干扰因素整理成可查的表，用于看懂报告上的数字。</p>`},
 {id:'A2',h:'一页纸摘要',html:`<div class="mat-float"><ul class="bullets"><li>参考区间来自人群的统计分布，不是健康与生病的分界线，落在区间外不等于有病。</li><li>同一项目在不同实验室、不同检测方法下区间并不相同，横向比较要看各自的区间。</li><li>单项异常的信息量有限，判读要结合组合、趋势与临床表现。</li><li>影响结果的不只是疾病：饮食、运动、采样时间、药物、标本处理都在其中。</li></ul></div>`},
 {id:'A6',h:'边界声明',html:`<div class="opposed"><div><h5>这一页能帮你</h5><ul class="bullets"><li>查某个项目的大致参考区间</li><li>知道这个数字受什么影响</li></ul></div><div><h5>这一页不能</h5><ul class="bullets"><li>不能替代医生诊断</li><li>不能只看单个值下结论</li></ul></div></div>`},
 {id:'A5',h:'关键数字面板',html:`<div class="stats"><div class="stat"><b>95%</b><span>参考区间的划定口径，5% 健康人也会落在外面</span></div><div class="stat"><b>2–3 月</b><span>糖化血红蛋白反映的血糖时间跨度</span></div><div class="stat"><b>各自不同</b><span>男 / 女 / 年龄段的区间并不通用</span></div></div>`},
 {id:'A7',h:'前置门槛清单',html:`<table class="mini"><tr><th>类别</th><th>硬前置（缺了读不懂）</th><th>软前置（缺了读不深）</th></tr><tr><td>概念</td><td>理解「参考区间是人群统计范围」，不是健康标准</td><td>均值、标准差与 95% 区间的含义</td></tr><tr><td>学科</td><td>无——能读懂报告单即可</td><td>基础生理学与检验医学常识</td></tr><tr><td>通识</td><td>知道区间由各实验室自行建立</td><td>了解空腹与采样时间会影响结果</td></tr></table>`},
 {id:'G1',h:'分类索引',html:`<div class="chips"><span class="chip">血常规</span><span class="chip">肝功能</span><span class="chip">肾功能</span><span class="chip">血脂</span><span class="chip">血糖</span><span class="chip">甲状腺</span><span class="chip">电解质</span><span class="chip">尿常规</span></div>`},
 {id:'G2',h:'条目表',html:`<table class="mini mat-flat"><tr><th>项目</th><th>参考区间</th><th>单位</th><th>主要干扰</th></tr><tr><td>白细胞计数</td><td>3.5–9.5</td><td>10⁹/L</td><td>感染、应激、剧烈运动</td></tr><tr><td>血红蛋白（男）</td><td>130–175</td><td>g/L</td><td>脱水、吸烟、高原居住</td></tr><tr><td>丙氨酸氨基转移酶</td><td>男 ≤ 50 / 女 ≤ 35</td><td>U/L</td><td>饮酒、熬夜、药物、剧烈运动</td></tr></table>`},
 {id:'H1',h:'数值参考表',html:`<table class="mini mat-flat"><tr><th>项目</th><th>下限</th><th>上限</th><th>单位</th></tr><tr><td>总胆固醇</td><td>—</td><td>5.2</td><td>mmol/L</td></tr><tr><td>甘油三酯</td><td>—</td><td>1.7</td><td>mmol/L</td></tr><tr><td>HDL-C（男）</td><td>1.0</td><td>—</td><td>mmol/L</td></tr><tr><td>空腹血糖</td><td>3.9</td><td>6.1</td><td>mmol/L</td></tr></table>`},
 {id:'H3',h:'单位换算',html:`<table class="mini"><tr><th>换算</th><th>关系</th></tr><tr><td>mg/dL → mmol/L（胆固醇）</td><td>÷ 38.67</td></tr><tr><td>mg/dL → mmol/L（甘油三酯）</td><td>÷ 88.57</td></tr><tr><td>mg/dL → mmol/L（葡萄糖）</td><td>÷ 18.0</td></tr></table>`},
 {id:'G3',h:'别名与缩写索引',html:`<table class="mini"><tr><th>常见写法</th><th>对应条目</th></tr><tr><td>ALT / 谷丙转氨酶 / GPT</td><td>丙氨酸氨基转移酶</td></tr><tr><td>AST / 谷草转氨酶 / GOT</td><td>天冬氨酸氨基转移酶</td></tr><tr><td>Cr / 肌酐</td><td>血清肌酐</td></tr><tr><td>TG / 甘油三酯</td><td>甘油三酯</td></tr></table>`},
 {id:'G6',h:'对比表',html:`<div class="opposed"><div><h5>空腹血糖</h5><p>反映即时糖代谢。</p><p class="alias">主要干扰：前一晚饮食与睡眠。</p></div><div><h5>糖化血红蛋白</h5><p>反映近 2–3 个月的平均血糖。</p><p class="alias">主要干扰：贫血、血红蛋白异常。</p></div><div class="verdict"><h5>怎么选</h5><p>要当场结果看空腹血糖，要看长期控制看糖化——两者都不是对方的高精度替代。</p></div></div>`},
 {id:'F1',h:'判别标准',html:`<table class="mini"><tr><th>判据</th><th>怎么看</th><th>处置方向</th></tr><tr><td>轻微超出参考区间</td><td>先看超多少、是否首次出现，再看同组的其他项目</td><td><span class="pill neutral">可观察</span></td></tr><tr><td>多个相关项目同时异常</td><td>比单项超标更值得关注——通常指向同一系统的问题</td><td><span class="pill warn">需复查</span></td></tr><tr><td>由正常转为持续异常</td><td>同一个人身上的趋势，比单次值更有信息量</td><td><span class="pill bad">需就医评估</span></td></tr></table>`},
 {id:'F3',h:'适用条件与边界',html:`<ul class="bullets"><li><strong>适用</strong>：成年人常规体检报告的初步对照</li><li><strong>不适用</strong>：孕妇、儿童、慢病患者——这些人群的区间另行规定</li></ul>`},
 {id:'G5',h:'常见问题 FAQ',html:`<details class="fold"><summary>参考区间外的值一定有问题吗？</summary><div class="ans">不一定。区间按人群 95% 划定，本就允许约 5% 的健康人落在外面；要结合症状、趋势与其他项目看。</div></details><details class="fold"><summary>不同医院的区间为什么不一样？</summary><div class="ans">检测方法、仪器与试剂不同，参考区间由各自实验室建立，跨机构比较要看具体区间。</div></details>`},
 {id:'J4',h:'时效与半衰期',html:`<table class="mini"><tr><th>字段</th><th>值</th></tr><tr><td>内容截止</td><td>2026-10</td></tr><tr><td>更新速度</td><td>慢：常用项目区间多年稳定，但检测标准偶有调整</td></tr><tr><td>使用提醒</td><td>以你手上报告单标注的区间为准，本页只作对照</td></tr></table>`},
 {id:'E8',h:'常见误区与陷阱',html:`<div class="fix"><del>「超出参考区间就是有病」</del><ins>区间只描述多数人的范围，判读要结合临床表现与复查结果。</ins><span class="why">错在哪：把统计分布当成了诊断标准。</span></div><div class="fix"><del>「箭头越多问题越大」</del><ins>要看异常是否集中在同一系统，单项轻度偏移常无意义。</ins><span class="why">错在哪：忽略了指标之间的相关性。</span></div><div class="fix"><del>「去年正常今年也该正常」</del><ins>对同一个人，变化的幅度常比绝对值更有信息量。</ins><span class="why">错在哪：忽略了趋势与个体基线。</span></div>`},
 {id:'I1',h:'学习路线图',html:`<ul class="checklist"><li>先认常用项目的单位与含义</li><li>学会查区间与常见干扰因素</li><li>理解成套判读（肝功、血脂、血糖各自成组看）</li><li>能分辨「可以观察」「需要复查」与「需要就医」</li><li>建立自己的历史记录，学会看趋势</li></ul>`},
 {id:'I5',h:'学完能做什么',html:`<ul class="bullets"><li>拿到一份报告单，能逐项查出一项指标的含义与自己实验室的参考区间。</li><li>能判断某个轻度异常属于可以观察、需要复查还是需要就医。</li><li>能说出影响某项结果的三类常见干扰因素。</li><li>能把自己的历年结果整理成趋势，而不只看单次数值。</li></ul>`},
 {id:'J9',h:'相关主题声明',html:`<table class="mini"><tr><th>主题</th><th>关系</th><th>为什么相关</th></tr><tr><td>生理学基础</td><td>前置</td><td>不知道器官功能就判断不出指标指向</td></tr><tr><td>体检报告解读</td><td>后继</td><td>拿到区间之后要面对的解释问题</td></tr><tr><td>营养与膳食指南</td><td>并列</td><td>同属自我健康管理的相邻页</td></tr><tr><td>检验医学与统计学</td><td>跨学科</td><td>参考区间到底是怎么定出来的</td></tr><tr><td>体检套餐营销</td><td>争议</td><td>「项目越多越好」的说法本身存疑</td></tr></table>`},
 {id:'J10',h:'延伸问题',html:`<ul class="bullets"><li>参考区间为什么各医院不一样？<span class="note"> → 检验方法学与区间建立</span></li><li>单次超标和持续超标，意义差在哪？<span class="note"> → 趋势判读</span></li><li>体检应该查多勤？<span class="note"> → 筛查策略与成本</span></li></ul>`},
 {id:'J5',h:'来源与参考',html:`<ul class="bullets"><li>各医院检验科报告单标注区间</li><li>检验医学教科书与卫生行业标准</li><li>说明：本页为个人整理，不构成医疗建议</li></ul>`}
 ]},

/* ============ 4. 判断型 ============ */
{key:'panduan', label:'判断型 · 投资决策框架', type:'判断型', title:'投资决策框架',
 sub:'骨架主体 = 判别标准 + 反例 + 争议标注 + 适用条件。共 19 节。三个层：头部基线 4 节、类型专属 9 节、尾部基线 6 节；其中「共识与争议」为属性触发。',
 layers:{head:['A1','A2','A6','A7'], tail:['E8','I1','I5','J9','J10','J5'], attr:{F4:'共识度＝存在活跃争议'}},
 sections:[
 {id:'A1',h:'一句话定位',html:`<p class="ln">这一页给出一套可以照着走的判断流程：哪些标的有资格进入观察名单，什么条件下才动手，以及什么情况下必须放弃。</p>`},
 {id:'A2',h:'一页纸摘要',html:`<div class="mat-float"><ul class="bullets"><li>先看它值多少钱，再看现在卖多少钱——顺序反了就是猜。</li><li>低估值可能是机会，也可能是结果；判据要比对基本面方向。</li><li>任何框架的失效区都要提前写清楚，否则会在最需要它的时候失灵。</li></ul></div>`},
 {id:'A6',h:'边界声明',html:`<div class="opposed"><div><h5>这一页讲</h5><ul class="bullets"><li>一套可复述的筛选与决策流程</li><li>判据、阈值，以及它们各自何时失效</li></ul></div><div><h5>这一页不讲</h5><ul class="bullets"><li>具体标的的买卖建议</li><li>收益预测与择时技巧</li></ul></div></div>`},
 {id:'A7',h:'前置门槛清单',html:`<table class="mini"><tr><th>类别</th><th>硬前置（缺了读不懂）</th><th>软前置（缺了读不深）</th></tr><tr><td>概念</td><td>会读利润表、资产负债表与现金流量表</td><td>折现、机会成本与风险溢价</td></tr><tr><td>学科</td><td>无——从常识出发也能用</td><td>会计基础与公司财务</td></tr><tr><td>通识</td><td>理解「预期收益与风险是一体的」</td><td>知道市场并不总是有效</td></tr><tr><td>工具</td><td>能查到至少 5 年的公开财务数据</td><td>会做简单表格与历史分位计算</td></tr></table>`},
 {id:'F1',h:'判别标准',html:`<table class="mini"><tr><th>判据</th><th>阈值刻度</th><th>结论</th></tr><tr><td>估值分位</td><td class="scale-cell"><span class="scale"><u style="left:0;width:30%"></u><i style="left:30%"></i></span><span class="thrv">低于近 10 年 30% 分位</span></td><td><span class="pill ok">进入观察名单</span></td></tr><tr><td>现金流覆盖</td><td class="scale-cell"><span class="scale"><u style="left:47%;width:53%"></u><i style="left:47%"></i></span><span class="thrv">经营现金流 / 净利润 ≥ 0.7</span></td><td><span class="pill warn">利润质量存疑，需核查</span></td></tr><tr><td>负债结构</td><td class="scale-cell"><span class="scale"><u style="left:0;width:50%"></u><i class="over" style="left:50%"></i></span><span class="thrv">有息负债 / 经营现金流 ≤ 4</span></td><td><span class="pill bad">周期下行时风险放大</span></td></tr></table>`},
 {id:'B6',h:'决策树',html:`<ul class="tree"><li>能说清它靠什么赚钱吗？<ul><li>不能 → 停止，不进入下一步</li><li>能 → 现在的价格低于你的估值吗？<ul><li>否 → 放观察名单</li><li>是 → 基本面在改善还是恶化？<ul><li>恶化 → 这是陷阱，不是机会</li><li>改善 → 进入仓位管理</li></ul></li></ul></li></ul></li></ul>`},
 {id:'F6',h:'权衡对比表',html:`<div class="opposed"><div><h5>集中持有少数标的</h5><p>研究深度足够、能承受回撤时的选择。</p><p class="alias">代价：波动大，判断错了没有对冲。</p></div><div><h5>分散持有</h5><p>时间有限、追求稳健时的选择。</p><p class="alias">代价：收益被平庸标的拉平。</p></div><div class="verdict"><h5>怎么选</h5><p>决定因素是你实际能投入的研究时间，而不是对收益的期望。</p></div></div>`},
 {id:'F2',h:'反例与失败案例',html:`<div class="mini"><h4>低估值陷阱</h4><p>分位低于 20%，但基本面持续恶化时，低估值是结果而不是机会。典型形态：需求结构已变，盈利中枢下移，历史分位不再可比。</p></div>`},
 {id:'F3',h:'适用条件与边界',html:`<ul class="bullets"><li><strong>适用</strong>：可估值、流动性较好、持有期 3 年以上的公开市场标的</li><li><strong>不适用</strong>：无法估值的新兴资产；期限在一年内、需要择时的资金</li><li><strong>失效信号</strong>：当判断依据从「值多少钱」变成「别人会出多少钱」时，框架已经失效</li></ul>`},
 {id:'F4',h:'共识与争议分离',html:`<table class="mini"><tr><th>结论</th><th>状态</th></tr><tr><td>长期看价格向价值回归</td><td><span class="pill ok">已定论</span></td></tr><tr><td>低估值因子长期超额收益</td><td><span class="pill warn">仍有争论</span>（不同市场、不同时段结论不一致）</td></tr><tr><td>某类指标能预测短期涨跌</td><td><span class="pill neutral">证据不足</span></td></tr></table>`},
 {id:'F5',h:'证据与来源分级',html:`<table class="mini"><tr><th>等级</th><th>来源类型</th></tr><tr><td><span class="pill grade ok">A</span></td><td>可核对的财务报告原始数据</td></tr><tr><td><span class="pill grade info">B</span></td><td>长期跟踪的行业数据与统计年鉴</td></tr><tr><td><span class="pill grade warn">C</span></td><td>卖方研报与专家访谈</td></tr><tr><td><span class="pill grade neutral">D</span></td><td>市场传闻与社群观点，仅供参考</td></tr></table>`},
 {id:'E5',h:'行动触发器',html:`<ul class="bullets"><li>每当看到「历史年化收益」→ 先问：起止时间怎么选的？</li><li>每当想「这次不一样」→ 先问：不一样在哪里，有没有可验证的证据？</li><li>每当听到「大家都这么做」→ 先问：这句话的来源是哪一级？</li></ul>`},
 {id:'I2',h:'自测题库',html:`<details class="fold"><summary>题 1 · 某标的估值分位 15%，但连续三年经营现金流转负。按本页框架，它属于哪一类？</summary><div class="ans">不满足现金流覆盖判据，属于「低估值陷阱」候选，<b>应停止而非进入仓位管理</b>。</div></details>`},
 {id:'E8',h:'常见误区与陷阱',html:`<div class="fix"><del>「跌得多就是便宜」</del><ins>便宜是相对内在价值说的，先要有估值锚。</ins><span class="why">错在哪：把价格变动当成了价值变化。</span></div><div class="fix"><del>「好公司什么价格都能买」</del><ins>好公司买贵了，长期回报同样会平庸。</ins><span class="why">错在哪：忽略了买入价对长期回报的决定作用。</span></div><div class="fix"><del>「这次不一样」</del><ins>除非说清哪个变量变了、原判据为何失效，否则默认它没变。</ins><span class="why">错在哪：忽略了判据的可检验性。</span></div>`},
 {id:'I1',h:'学习路线图',html:`<ul class="checklist"><li>先建立估值锚：这家公司值多少钱，凭什么</li><li>掌握三种常见判据及其适用条件</li><li>练习写失效条件与退出规则</li><li>用小仓位验证流程，而不是验证判断</li><li>复盘误判，区分「判断错」与「流程错」</li></ul>`},
 {id:'I5',h:'学完能做什么',html:`<ul class="bullets"><li>能对一个陌生标的写出它的估值锚与三条进入判据。</li><li>能在买入之前写出这单的失效条件与退出动作。</li><li>能识别一条投资说法里哪一环是假设、哪一环是事实。</li><li>能复盘一次亏损，判断是判断错了还是流程漏了。</li></ul>`},
 {id:'J9',h:'相关主题声明',html:`<table class="mini"><tr><th>主题</th><th>关系</th><th>为什么相关</th></tr><tr><td>财务报表阅读</td><td>前置</td><td>本页判据全部来自三张表</td></tr><tr><td>仓位与风险管理</td><td>后继</td><td>判断对了还要解决「下多少」</td></tr><tr><td>指数化投资</td><td>并列</td><td>与主动判断构成两条路线，可对照取舍</td></tr><tr><td>行为金融学</td><td>跨学科</td><td>解释框架为什么会被自己违背</td></tr><tr><td>技术分析</td><td>争议</td><td>与本页判据体系不兼容，需明确取舍</td></tr></table>`},
 {id:'J10',h:'延伸问题',html:`<ul class="bullets"><li>同一套判据换个市场还成立吗？<span class="note"> → 市场结构差异</span></li><li>明知框架对，情绪上却做不到怎么办？<span class="note"> → 行为金融与纪律设计</span></li><li>不选个股还能用这套判据吗？<span class="note"> → 指数与资产配置</span></li></ul>`},
 {id:'J5',h:'来源与参考',html:`<ul class="bullets"><li>上市公司定期报告与公开财务数据</li><li>统计年鉴与行业长期数据</li><li>说明：本文为个人框架整理，不构成投资建议</li></ul>`}
 ]},

/* ============ 5. 史实型 ============ */
{key:'shishi', label:'史实型 · 二战史', type:'史实型', title:'第二次世界大战（1939–1945）',
 sub:'骨架主体 = 时间轴 + 因果链 + 分期 + 争议与史料。共 18 节。三个层：头部基线 4 节、类型专属 8 节、尾部基线 6 节；其中「分期与阶段」「共识与争议」为属性触发。',
 layers:{head:['A1','A2','A6','A7'], tail:['E8','I1','I5','J9','J10','J5'], attr:{D2:'时间性＝有强演化史', F4:'共识度＝存在活跃争议'}},
 sections:[
 {id:'A1',h:'一句话定位',html:`<p class="ln">这一页按时间与因果梳理二战：它怎么从地区冲突变成全球战争，几个关键转折点如何改变结局，以及哪些结论至今仍有争议。</p>`},
 {id:'A2',h:'一页纸摘要',html:`<div class="mat-float"><ul class="bullets"><li>根源是凡尔赛体系失衡叠加经济大萧条，导火索是 1939 年入侵波兰。</li><li>1941–1942 年三个转折点：莫斯科、中途岛、斯大林格勒。</li><li>战争的结局不只由战场决定，也由工业产能与后勤体系决定。</li></ul></div>`},
 {id:'A6',h:'边界声明',html:`<div class="opposed"><div><h5>这一页讲</h5><ul class="bullets"><li>战争的时间线、因果链与几个关键转折</li><li>哪些结论已有共识、哪些仍在史学争论中</li></ul></div><div><h5>这一页不讲</h5><ul class="bullets"><li>战役的战斗细节与武器参数</li><li>单一国家的纪念性叙事</li></ul></div></div>`},
 {id:'A7',h:'前置门槛清单',html:`<table class="mini"><tr><th>类别</th><th>硬前置（缺了读不懂）</th><th>软前置（缺了读不深）</th></tr><tr><td>概念</td><td>大国、同盟、总动员、闪击战的基本含义</td><td>凡尔赛体系、绥靖政策、总体战</td></tr><tr><td>学科</td><td>无——有兴趣就能读</td><td>世界近现代史与地理常识</td></tr><tr><td>通识</td><td>能在地图上定位欧洲与太平洋主要战场</td><td>知道一战与二战之间的因果联系</td></tr></table>`},
 {id:'B7',h:'时间轴',html:`<ol class="tl"><li><span class="yr">1939</span>德国入侵波兰，欧洲战场开启</li><li><span class="yr">1941</span>巴巴罗萨行动；珍珠港事件，战争全球化</li><li><span class="yr">1942</span>中途岛与斯大林格勒，战局转折</li><li><span class="yr">1944</span>诺曼底登陆，西线重开</li><li><span class="yr">1945</span>德国投降；日本投降，战争结束</li></ol>`},
 {id:'D2',h:'分期与阶段',html:`<div class="grid2"><div class="mini"><h4>1918–1939 战间期</h4><p>凡尔赛体系的裂痕与极权崛起</p></div><div class="mini"><h4>1939–1941 欧洲战争</h4><p>闪击战、不列颠空战、巴巴罗萨</p></div><div class="mini"><h4>1941–1943 全球战争</h4><p>太平洋与北非，同盟国转入反攻</p></div><div class="mini"><h4>1944–1945 结局</h4><p>双线推进，轴心国相继投降</p></div></div>`},
 {id:'D3',h:'因果链',html:`<div class="chain"><span>凡尔赛体系失衡</span><i>→</i><span>经济大萧条</span><i>→</i><span>极端民族主义上台</span><i>→</i><span>扩张政策失控</span><i>→</i><span>全面战争</span></div><p class="note">链条中每一环都是必要条件而非充分条件；把任一环单拎出来都会变成过度简化。</p>`},
 {id:'D6',h:'里程碑事件卡',html:`<div class="mat-float"><h4>斯大林格勒战役</h4><p class="alias">时间 · 1942.7–1943.2　地点 · 苏联斯大林格勒（今伏尔加格勒）</p><p>参与方：德国第 6 集团军及轴心国仆从军；苏联斯大林格勒方面军、顿河方面军。</p><p>结果：德军第 6 集团军被围歼，苏军由此转入战略反攻。</p><p>影响：东线主动权易手，成为整场战争的转折点之一。</p></div><div class="mat-float"><h4>诺曼底登陆</h4><p class="alias">时间 · 1944.6.6　地点 · 法国诺曼底海岸</p><p>参与方：美英加联军（盟军）对德国西线守军。</p><p>结果：第二战场开辟，盟军在欧洲大陆站稳脚跟。</p><p>影响：德国陷入两线作战，西线崩溃进程加快。</p></div>`},
 {id:'D4',h:'重要人物与学派',html:`<table class="mini"><tr><th>人物</th><th>身份</th><th>关键作用</th></tr><tr><td>罗斯福</td><td>美国总统</td><td>推动租借法案，使美国成为「民主国家兵工厂」</td></tr><tr><td>丘吉尔</td><td>英国首相</td><td>坚持不媾和，维系西线抵抗意志</td></tr><tr><td>斯大林</td><td>苏联领导人</td><td>承受东线主要压力，主导战后东欧格局</td></tr></table>`},
 {id:'D5',h:'史学流派对比',html:`<div class="opposed three"><div><h5>意图主义</h5><p>战争源于特定决策者的扩张意图。</p><p class="alias">依据：决策过程档案。</p></div><div><h5>功能主义</h5><p>战争源于体系失序与国内压力。</p><p class="alias">依据：结构与经济分析。</p></div><div><h5>修正派</h5><p>各方责任被战后叙事重新分配。</p><p class="alias">依据：多国档案对比。</p></div><div class="verdict"><h5>分歧在哪</h5><p>三方共用大部分史料，分歧在权重：个人意志、体系结构、战后叙事各占多少。</p></div></div>`},
 {id:'F4',h:'争议与史料',html:`<table class="mini"><tr><th>问题</th><th>状态</th></tr><tr><td>战争爆发的首要责任方</td><td><span class="pill warn">史学界仍有争论</span></td></tr><tr><td>原子弹使用的必要性</td><td><span class="pill warn">长期争议</span>，取决于对日本投降条件的评估</td></tr><tr><td>某战役双方伤亡数字</td><td><span class="pill neutral">口径不一</span>，各国档案只能给区间</td></tr></table>`},
 {id:'J7',h:'影响与遗产',html:`<ul class="bullets"><li>联合国与战后国际秩序的设计，直接回应了战间期国际机制的失效</li><li>殖民体系加速瓦解，两个超级大国格局成型</li><li>技术外溢：雷达、喷气机、计算机与核能的军事起源</li></ul>`},
 {id:'E8',h:'常见误区与陷阱',html:`<div class="fix"><del>「战争是希特勒一个人的决定」</del><ins>个人决策重要，但凡尔赛体系、经济危机与绥靖政策构成了他能走的空间。</ins><span class="why">错在哪：把结构因素简化成了个人意志。</span></div><div class="fix"><del>「原子弹结束了战争」</del><ins>苏联参战、日本资源枯竭与原子弹共同作用，各自权重仍有争论。</ins><span class="why">错在哪：把一个因素当成了唯一原因。</span></div><div class="fix"><del>「起因已经研究清楚了」</del><ins>主要轮廓有共识，各环节的权重仍是持续争论的问题。</ins><span class="why">错在哪：忽略了史料与解释的开放度。</span></div>`},
 {id:'I1',h:'延伸阅读路径',html:`<ul class="checklist"><li>先读一份通史性著作，建立时间与地理骨架</li><li>按战场分线深读（东线 / 西线 / 太平洋 / 中国战场）</li><li>再进入专题：经济动员、情报、占领政策</li><li>最后读史学争论，理解「为什么同一件事会有不同结论」</li></ul>`},
 {id:'I5',h:'学完能做什么',html:`<ul class="bullets"><li>能按时间与因果说出战争从地区冲突扩大为全球战争的关键链条。</li><li>能区分这个题目里哪些结论是共识、哪些是仍在争论的问题。</li><li>能对一条战争起因的解释，指出它偏重哪一类因素。</li><li>能顺着本页的分期，自己找一条线继续深读。</li></ul>`},
 {id:'J9',h:'相关主题声明',html:`<table class="mini"><tr><th>主题</th><th>关系</th><th>为什么相关</th></tr><tr><td>第一次世界大战与战后秩序</td><td>前置</td><td>凡尔赛体系的裂痕是二战的起点</td></tr><tr><td>冷战起源</td><td>后继</td><td>战争尾声直接塑造了战后格局</td></tr><tr><td>太平洋战争</td><td>并列</td><td>同一场战争的不同战场，可平行读</td></tr><tr><td>国际关系理论</td><td>跨学科</td><td>提供「体系为什么会失衡」的解释框架</td></tr><tr><td>战争责任与记忆政治</td><td>争议</td><td>各国叙事差异大，需带着立场意识读</td></tr></table>`},
 {id:'J10',h:'延伸问题',html:`<ul class="bullets"><li>如果 1941 年日本没有南进，战局会怎样？<span class="note"> → 反事实推演与史料边界</span></li><li>经济动员能力为什么能决定胜负？<span class="note"> → 战时经济与工业史</span></li><li>同一场战役，各国伤亡数字为什么对不上？<span class="note"> → 史料与档案方法</span></li></ul>`},
 {id:'J5',h:'来源与参考',html:`<ul class="bullets"><li>通史性学术著作与国家档案馆公开资料</li><li>各国官方战史与研究机构出版物</li><li>说明：涉及伤亡与责任判断处均标注争议状态</li></ul>`}
 ]}
];

/* ============================================================
   4. 渲染
   ============================================================ */
const TABS = [{id:'lib',label:'模块库 · 全量 '+MODULES.length+' 个'}]
  .concat(SKELETONS.map((s,i)=>({id:'sk'+i,label:s.label})));

const state = { tab:'lib', fam:'ALL', q:'' };

function moduleCard(m){
  return `<article class="mod" id="mod-${m.id}" data-fam="${m.fam}">
  <div class="mod-head"><span class="mid">${m.id}</span><h3>${m.name}</h3><span class="when">${m.when}</span></div>
  <p class="what">${m.what}</p>
  <div class="sample">${m.html}</div>
</article>`;
}

function renderLib(){
  const q = state.q.trim().toLowerCase();
  let html = `<div class="libbar">
    <div class="lead">全量模块池，按功能族分组，共 ${MODULES.length} 个。以下每个模块都是一个可复用片段；标出的「适用」表示它最常出现在哪类页面，不代表只能在那一类使用。</div>
    <div class="lead">呈现原型：<b>材质三档</b>——平（只用分隔线，给高密度表）、卡（默认）、浮（浅底加左侧色带，给结论与警示）；<b>字号分档</b>——12 标签 / 13.5 数据 / 14.5 正文 / 15 卡标题 / 17 节标题与结论 / 20 数字；<b>四类信息有固定形态</b>——对置（两栏加判定行）、阈值（刻度条加阈值线）、纠错（划去的说法加绿色正解）、折叠（默认收起）。同一族内不得有两个模块使用同一呈现原型。</div>
    <button class="btn ${state.fam==='ALL'?'on':''}" data-fam="ALL">全部</button>`;
  for(const k of Object.keys(FAMILIES)){
    html += `<button class="btn ${state.fam===k?'on':''}" data-fam="${k}">${k} ${FAMILIES[k]}</button>`;
  }
  html += `</div>`;

  let total = 0;
  for(const k of Object.keys(FAMILIES)){
    if(state.fam!=='ALL' && state.fam!==k) continue;
    const list = MODULES.filter(m=>m.fam===k && (!q || (m.id+m.name+m.what).toLowerCase().includes(q)));
    if(!list.length) continue;
    total += list.length;
    html += `<section class="fam"><h2><span class="famkey">${k}</span>${FAMILIES[k]}<span class="cnt">${list.length} 个 · ${FAM_DESC[k]}</span></h2>`;
    html += list.map(moduleCard).join('');
    html += `</section>`;
  }
  if(!total) html += `<p class="note">没有匹配「${state.q}」的模块。</p>`;
  return html;
}

function layerOf(s,x){
  const L = s.layers || {};
  if((L.head||[]).includes(x.id)) return ['base-head','基线 · 头部'];
  if((L.tail||[]).includes(x.id)) return ['base-tail','基线 · 尾部'];
  if(L.attr && L.attr[x.id]) return ['attr','属性触发'];
  return ['type','类型专属'];
}

function checkSpec(s){
  const L = s.layers || { head:[], tail:[], attr:{} };
  const ids = s.sections.map(x=>x.id);
  const head = L.head || [], tail = L.tail || [];
  const msgs = [];
  if(ids[0] !== 'A1') msgs.push('首个 section 应为 A1');
  if(head.length && ids.slice(0,head.length).join() !== head.join()) msgs.push(`头部基线未完整占据最前 ${head.length} 节`);
  if(tail.length && ids.slice(ids.length-tail.length).join() !== tail.join()) msgs.push(`尾部基线未完整占据最后 ${tail.length} 节`);
  const missing = head.concat(tail).filter(id=>!ids.includes(id));
  if(missing.length) msgs.push('基线层缺少 ' + missing.join('、'));
  const attrIds = Object.keys(L.attr||{}).filter(id=>ids.includes(id));
  const attrMissing = Object.keys(L.attr||{}).filter(id=>!ids.includes(id));
  return { ok: msgs.length===0, msgs, head, tail, attrIds, attrMissing, total: s.sections.length };
}

function renderSkeleton(s){
  const ck = checkSpec(s);
  let html = `<div class="skhead"><div class="sktype">${s.type}</div><h2>${s.title}</h2>
    <p>${s.sub}</p><div class="chips">`;
  html += s.sections.map(x=>`<a class="chip" href="#sk-${s.key}-${x.id}">${x.id} · ${x.h}</a>`).join('');
  html += `</div>`;

  const attrTxt = ck.attrIds.map(id=>`${id}（${(s.layers.attr||{})[id]}）`).join('、');
  html += `<div class="spec ${ck.ok?'ok':'bad'}">
    <div class="spec-line"><strong>骨架规格校验</strong><span class="${ck.ok?'ok':'bad'}">${ck.ok?'通过':'未通过'}</span>
      <span class="spec-meta">共 ${ck.total} 节 · 头部基线 ${ck.head.length} 节（${ck.head.join(' ')}） · 尾部基线 ${ck.tail.length} 节（${ck.tail.join(' ')}）</span></div>
    <div class="spec-meta">属性触发节：${attrTxt || '无'}${ck.attrMissing.length ? '；已声明但未入骨架：' + ck.attrMissing.join('、') : ''}</div>
    ${ck.msgs.length ? `<ul class="spec-msg">${ck.msgs.map(m=>`<li>${m}</li>`).join('')}</ul>` : ''}
    <div class="spec-meta">基线层的头部与尾部在每一类骨架中都必须出现且位置固定；类型专属层随知识类型而变；属性触发层由话题属性决定是否出现。</div>
  </div></div>`;

  s.sections.forEach((x,i)=>{
    const lay = layerOf(s,x);
    const cond = (s.layers && s.layers.attr) ? s.layers.attr[x.id] : '';
    html += `<section class="sksec" id="sk-${s.key}-${x.id}">
      <div class="sksec-head"><span class="mid">${x.id}</span><h3>${x.h}</h3><span class="lay ${lay[0]}"${cond?` title="触发条件：${cond}"`:''}>${lay[1]}</span><span class="ord">${String(i+1).padStart(2,'0')} / ${String(s.sections.length).padStart(2,'0')}</span></div>
      <div class="sksec-body">${x.html}</div></section>`;
  });
  return html;
}

function render(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(t=>`<button class="tab ${state.tab===t.id?'on':''}" data-tab="${t.id}">${t.label}</button>`).join('');

  const app = document.getElementById('app');
  if(state.tab==='lib'){ app.innerHTML = renderLib(); return; }
  const i = Number(state.tab.slice(2));
  app.innerHTML = renderSkeleton(SKELETONS[i]);
}

document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('[data-tab]'); if(!b) return;
  state.tab = b.dataset.tab;
  window.scrollTo(0,0);
  render();
});

document.getElementById('app').addEventListener('click', e=>{
  const b = e.target.closest('[data-fam]'); if(!b) return;
  state.fam = b.dataset.fam; render();
});

document.getElementById('q').addEventListener('input', e=>{
  state.q = e.target.value;
  if(state.tab!=='lib'){ state.tab='lib'; }
  render();
});

document.getElementById('modeBtn').addEventListener('click', ()=>{
  const dark = document.documentElement.dataset.mode === 'dark';
  document.documentElement.dataset.mode = dark ? 'light' : 'dark';
  document.getElementById('modeBtn').textContent = dark ? '暗色' : '亮色';
});

render();
</script>
</body>
</html>
