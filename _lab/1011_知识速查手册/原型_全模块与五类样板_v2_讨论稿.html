<!DOCTYPE html>
<html lang="zh-CN" data-theme="n" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 v2 · 契约驱动的模块库与五类骨架</title>
<style>
/* ============================================================
   1. 令牌契约：18 个颜色变量，浅深两态各写全
   组件样式只读变量，换主题只换变量，不动版面
   ============================================================ */
html[data-theme="n"]{ --accent-l:#3b5bdb; --accent-l-bg:#eef1fd; --accent-d:#93a5ff; --accent-d-bg:#1c2340; }
html[data-theme="a"]{ --accent-l:#0f766e; --accent-l-bg:#e6f4f2; --accent-d:#5eead4; --accent-d-bg:#10231f; }
html[data-theme="b"]{ --accent-l:#b45309; --accent-l-bg:#fbf1e4; --accent-d:#fbbf24; --accent-d-bg:#2a2110; }
html[data-theme="c"]{ --accent-l:#4338ca; --accent-l-bg:#eeecfd; --accent-d:#a5b4fc; --accent-d-bg:#1d1f3d; }
html[data-theme="d"]{ --accent-l:#9d174d; --accent-l-bg:#fbeaf0; --accent-d:#f9a8c4; --accent-d-bg:#2c1420; }
html[data-theme="e"]{ --accent-l:#166534; --accent-l-bg:#e8f5ec; --accent-d:#86efac; --accent-d-bg:#12251a; }

:root{
  --bg:#ffffff; --paper:#fcfcfb; --ink:#15171c; --ink-2:#484d57; --ink-3:#7a818d;
  --line:#e2e4e8; --line-2:#eef0f3; --fill:#f4f5f7;
  --ok:#15803d; --ok-bg:#eaf6ee; --err:#b91c1c; --err-bg:#fdeeee;
  --warn:#a16207; --warn-bg:#fbf4e3; --head-bg:#f7f8fa; --head-fg:#15171c;
  --accent:var(--accent-l); --accent-bg:var(--accent-l-bg);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
  --radius:10px; --radius-sm:6px;
}
html[data-mode="dark"]{
  --bg:#0f1116; --paper:#14171d; --ink:#e7e9ee; --ink-2:#a8adb8; --ink-3:#7c828e;
  --line:#262a33; --line-2:#1d2129; --fill:#1a1e26;
  --ok:#4ade80; --ok-bg:#122a1c; --err:#f87171; --err-bg:#2a1616;
  --warn:#fbbf24; --warn-bg:#2a2110; --head-bg:#171a21; --head-fg:#e7e9ee;
  --accent:var(--accent-d); --accent-bg:var(--accent-d-bg);
}

/* ------------------------------------------------------------
   2. 基础
   ------------------------------------------------------------ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{margin:0;line-height:1.4;font-weight:650}
p{margin:0 0 10px}
ul,ol{margin:0;padding-left:1.25em}
code,.mono{font-family:var(--mono);font-size:.92em}
a{color:var(--accent)}

/* ------------------------------------------------------------
   3. 顶栏与页签
   ------------------------------------------------------------ */
.top{
  position:sticky; top:0; z-index:50;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1180px; margin:0 auto; padding:0 22px;
  display:flex; align-items:center; gap:18px; height:54px;
}
.brand{display:flex; align-items:baseline; gap:8px; flex:none}
.brand b{font-size:15px; letter-spacing:.02em}
.brand span{font-size:12px; color:var(--ink-3)}
.tabs{display:flex; gap:2px; flex:1; min-width:0; overflow-x:auto}
.tab{
  border:0; background:none; color:var(--ink-2); cursor:pointer;
  font:inherit; font-size:13.5px; padding:7px 11px; border-radius:var(--radius-sm);
  white-space:nowrap;
}
.tab:hover{background:var(--fill); color:var(--ink)}
.tab.on{background:var(--accent-bg); color:var(--accent); font-weight:600}
.ctrl{display:flex; align-items:center; gap:8px; flex:none}
.ctrl select,.icobtn{
  font:inherit; font-size:13px; color:var(--ink-2); background:var(--bg);
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:5px 9px; cursor:pointer;
}
.icobtn:hover{background:var(--fill); color:var(--ink)}

main{max-width:1180px; margin:0 auto; padding:26px 22px 80px}
.lede{color:var(--ink-2); max-width:78ch; margin-bottom:20px}
.lede strong{color:var(--ink)}
.h2{font-size:17px; margin:28px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line)}
.h3{font-size:14.5px; margin:18px 0 8px; color:var(--ink-2)}
.foot{max-width:1180px; margin:0 auto; padding:0 22px 40px; color:var(--ink-3); font-size:12.5px}

/* ------------------------------------------------------------
   4. 通用件
   ------------------------------------------------------------ */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.mini{background:var(--fill); border-radius:var(--radius-sm); padding:10px 12px}
.mini h4{font-size:13.5px; margin-bottom:3px}
.mini p{margin:0; font-size:13.5px; color:var(--ink-2)}
.badge{
  display:inline-block; font-size:11.5px; line-height:1.6; padding:1px 7px;
  border-radius:99px; background:var(--fill); color:var(--ink-3);
}
.badge.accent{background:var(--accent-bg); color:var(--accent)}
.badge.ok{background:var(--ok-bg); color:var(--ok)}
.badge.err{background:var(--err-bg); color:var(--err)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.mid{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.note{font-size:13px; color:var(--ink-3); border-left:2px solid var(--line); padding-left:9px; margin:8px 0 0}
.btn{
  font:inherit; font-size:13px; background:var(--bg); color:var(--ink-2);
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer;
}
.btn:hover{background:var(--fill); color:var(--ink)}
.btn.on{background:var(--accent-bg); border-color:transparent; color:var(--accent); font-weight:600}

/* 表格 */
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; margin:2px 0}
table.tbl th,table.tbl td{
  text-align:left; padding:6px 9px; border-bottom:1px solid var(--line-2); vertical-align:top;
}
table.tbl th{background:var(--head-bg); color:var(--head-fg); font-weight:600; font-size:12.5px; white-space:nowrap}
table.tbl tr:last-child td{border-bottom:0}

/* ------------------------------------------------------------
   5. 形状层：每个形状一套明显不同的外观
   ------------------------------------------------------------ */
.s{margin:0}
.s-lead{font-size:16px; line-height:1.7}
.s-lead strong{color:var(--accent)}
.s-bullets{padding-left:0; list-style:none}
.s-bullets li{position:relative; padding-left:16px; margin-bottom:6px}
.s-bullets li::before{content:""; position:absolute; left:2px; top:.72em; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.s-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px}
.s-card{background:var(--fill); border-radius:var(--radius-sm); padding:10px 12px; border-top:2px solid var(--accent)}
.s-card h4{font-size:13.5px; margin-bottom:3px}
.s-card p{margin:0; font-size:13px; color:var(--ink-2)}
.s-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.s-stat{background:var(--accent-bg); border-radius:var(--radius-sm); padding:11px 13px}
.s-stat b{display:block; font-size:21px; line-height:1.25; color:var(--accent); font-variant-numeric:tabular-nums}
.s-stat span{font-size:12.5px; color:var(--ink-2)}
.s-twocol{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden}
.s-twocol>div{padding:11px 13px}
.s-twocol>div+div{border-left:1px solid var(--line)}
.s-twocol h5{font-size:12.5px; color:var(--ink-3); margin-bottom:6px; text-transform:none}
.s-twocol ul{padding-left:0; list-style:none; margin:0}
.s-twocol li{position:relative; padding-left:14px; font-size:13.5px; margin-bottom:4px}
.s-twocol li::before{content:"—"; position:absolute; left:0; color:var(--accent)}
.s-tree{list-style:none; padding-left:0}
.s-tree ul{list-style:none; padding-left:18px; border-left:1px solid var(--line); margin:3px 0}
.s-tree li{position:relative; padding-left:12px; margin:3px 0; font-size:13.5px}
.s-tree li::before{content:""; position:absolute; left:0; top:.75em; width:7px; height:1px; background:var(--line)}
.s-steps{list-style:none; counter-reset:st; padding-left:0}
.s-steps li{counter-increment:st; position:relative; padding-left:38px; margin-bottom:10px}
.s-steps li::before{
  content:counter(st,decimal-leading-zero); position:absolute; left:0; top:1px;
  font-family:var(--mono); font-size:12px; color:var(--accent);
  background:var(--accent-bg); border-radius:var(--radius-sm); padding:1px 6px;
}
.s-steps b{font-weight:600}
.s-flow{display:flex; flex-wrap:wrap; align-items:center; gap:7px}
.s-flow span{background:var(--fill); border-radius:99px; padding:4px 12px; font-size:13px}
.s-flow i{color:var(--ink-3); font-style:normal; font-size:12px}
.s-chain{display:flex; flex-wrap:wrap; align-items:center; gap:7px}
.s-chain span{background:var(--accent-bg); color:var(--accent); border-radius:var(--radius-sm); padding:3px 10px; font-size:13px}
.s-chain i{color:var(--ink-3); font-style:normal}
.s-map{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.s-map .hub{
  flex:none; width:96px; height:96px; border-radius:50%; background:var(--accent-bg);
  color:var(--accent); display:grid; place-items:center; font-weight:650; text-align:center; padding:8px;
}
.s-map .ring{display:flex; flex-wrap:wrap; gap:6px; max-width:560px}
.s-map .ring span{border:1px solid var(--line); border-radius:99px; padding:3px 11px; font-size:13px; background:var(--paper)}
.s-timeline{list-style:none; padding-left:0; border-left:2px solid var(--line); margin-left:4px}
.s-timeline li{position:relative; padding:0 0 14px 20px}
.s-timeline li::before{content:""; position:absolute; left:-6px; top:.45em; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg)}
.s-timeline .yr{display:block; font-family:var(--mono); font-size:12.5px; color:var(--accent); font-weight:600}
.s-tiers{display:grid; gap:8px}
.s-tier{display:flex; gap:12px; align-items:flex-start; background:var(--fill); border-radius:var(--radius-sm); padding:9px 13px; border-left:3px solid var(--accent)}
.s-tier .lv{flex:none; width:44px; font-size:12.5px; color:var(--accent); font-weight:600}
.s-tier p{margin:0; font-size:13.5px}
.s-terms{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:10px}
.s-term{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; background:var(--paper)}
.s-term b{font-size:14px}
.s-term .en{display:block; font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin:1px 0 5px}
.s-term p{margin:0 0 5px; font-size:13px; color:var(--ink-2)}
.s-term .alias{font-size:12px; color:var(--ink-3)}
.s-formula{
  font-family:var(--mono); font-size:14px; background:var(--fill); border-radius:var(--radius-sm);
  padding:12px 14px; border-left:3px solid var(--accent); overflow-x:auto;
}
.s-chips{display:flex; flex-wrap:wrap; gap:6px}
.s-chips span{border:1px solid var(--line); border-radius:99px; padding:2px 11px; font-size:13px; background:var(--paper)}
.s-checklist{list-style:none; padding-left:0}
.s-checklist li{position:relative; padding-left:24px; margin-bottom:6px; font-size:13.5px}
.s-checklist li::before{
  content:""; position:absolute; left:0; top:.28em; width:12px; height:12px;
  border:1.5px solid var(--line); border-radius:3px; background:var(--bg);
}
.s-bars{display:grid; gap:7px}
.s-bar{display:flex; align-items:center; gap:9px; font-size:13px}
.s-bar .tk{flex:none; width:88px; color:var(--ink-2)}
.s-bar .tr{flex:1; height:9px; background:var(--fill); border-radius:99px; overflow:hidden; min-width:60px}
.s-bar .tr i{display:block; height:100%; background:var(--accent); border-radius:99px}
.s-bar .tv{flex:none; font-family:var(--mono); font-size:12.5px; color:var(--ink-2); min-width:44px; text-align:right}
.s-qa{border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:8px}
.s-qa summary{padding:9px 13px; font-size:13.5px; cursor:pointer; background:var(--paper); font-weight:600}
.s-qa summary::marker{color:var(--accent)}
.s-qa div{padding:9px 13px; border-top:1px solid var(--line-2); font-size:13.5px; color:var(--ink-2)}
.s-note{background:var(--warn-bg); color:var(--warn); border-radius:var(--radius-sm); padding:9px 13px; font-size:13.5px}
.s-note.info{background:var(--accent-bg); color:var(--accent)}
.s-kv{width:100%; border-collapse:collapse; font-size:13.5px}
.s-kv th{text-align:left; width:130px; padding:6px 10px 6px 0; color:var(--ink-3); font-weight:500; border-bottom:1px solid var(--line-2)}
.s-kv td{padding:6px 0; border-bottom:1px solid var(--line-2)}
.s-kv tr:last-child th,.s-kv tr:last-child td{border-bottom:0}

/* ------------------------------------------------------------
   6. 契约库
   ------------------------------------------------------------ */
.libbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px}
.libbar input[type=search]{
  font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--line);
  border-radius:var(--radius-sm); background:var(--bg); color:var(--ink); min-width:190px;
}
.mod{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:9px; overflow:hidden; background:var(--paper)}
.mod-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; padding:11px 14px 7px}
.mod-head h3{font-size:14.5px}
.kvline{display:flex; flex-wrap:wrap; gap:6px 14px; padding:0 14px 10px; font-size:12.5px; color:var(--ink-3)}
.kvline b{color:var(--ink-2); font-weight:600}
.mod-foot{display:flex; gap:8px; padding:0 14px 11px}
.mod-body{border-top:1px solid var(--line-2); padding:12px 14px; display:none}
.mod.open .mod-body{display:block}
.draft{
  font-family:var(--mono); font-size:12.5px; background:var(--fill); color:var(--ink-2);
  border-radius:var(--radius-sm); padding:10px 12px; white-space:pre-wrap; margin:9px 0 0; overflow-x:auto;
}
.subttl{font-size:12.5px; color:var(--ink-3); margin:0 0 6px}

/* ------------------------------------------------------------
   7. 形状层页
   ------------------------------------------------------------ */
.shape-box{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:11px; background:var(--paper)}
.shape-h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:11px 14px}
.shape-h code{font-size:13px; color:var(--accent); font-weight:600}
.shape-h .use{font-size:12.5px; color:var(--ink-3)}
.shape-b{padding:0 14px 14px}
.shape-b .split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:14px; align-items:start}
@media (max-width:860px){.shape-b .split{grid-template-columns:1fr}}

/* ------------------------------------------------------------
   8. 骨架页
   ------------------------------------------------------------ */
.skbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px}
.skbar .sep{width:1px; height:20px; background:var(--line); margin:0 4px}
.skhead{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--paper); margin-bottom:14px}
.skhead h2{font-size:17px; margin-bottom:5px}
.skhead .sub{color:var(--ink-2); font-size:13.5px; margin-bottom:9px}
.spec{background:var(--fill); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px}
.spec-line{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:5px}
.spec-line strong{color:var(--ink-2); font-weight:600}
.spec-msg{margin:5px 0 0; padding-left:1.1em; color:var(--err); font-size:12.5px}
.spec-meta{display:block; color:var(--ink-3); margin-top:5px}
.sksec{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; overflow:hidden; background:var(--paper)}
.sksec-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; padding:10px 14px 8px}
.sksec-head h3{font-size:14px}
.lay{font-size:11px; padding:1px 7px; border-radius:99px; background:var(--fill); color:var(--ink-3)}
.lay.base-head{background:var(--accent-bg); color:var(--accent)}
.lay.base-tail{background:var(--ok-bg); color:var(--ok)}
.lay.attr{background:var(--warn-bg); color:var(--warn)}
.sksec-body{padding:2px 14px 13px}
.sksec-draft{display:none; margin:0 14px 13px; font-family:var(--mono); font-size:12.5px; background:var(--fill); color:var(--ink-2); border-radius:var(--radius-sm); padding:10px 12px; white-space:pre-wrap}
.sksec.show-draft .sksec-draft{display:block}
.sksec.show-draft .sksec-body{display:none}
.missing{border:1px dashed var(--line); border-radius:var(--radius-sm); padding:9px 12px; font-size:13px; color:var(--ink-3)}

/* ------------------------------------------------------------
   9. 校验器
   ------------------------------------------------------------ */
textarea.draft-input{
  width:100%; min-height:190px; font-family:var(--mono); font-size:12.5px; line-height:1.7;
  background:var(--fill); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; resize:vertical;
}
.report{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--paper); margin-top:12px}
.report .ln{font-family:var(--mono); font-size:12.5px; margin:0 0 4px; color:var(--err)}
.report .ln.ok{color:var(--ok)}
.report .fix{
  font-family:var(--mono); font-size:12px; background:var(--ok-bg); color:var(--ok);
  border-radius:var(--radius-sm); padding:7px 10px; white-space:pre-wrap; margin:6px 0 10px;
}
.presets{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}

@media (max-width:700px){
  .top-in{height:auto; flex-wrap:wrap; padding:9px 14px; gap:9px}
  main{padding:18px 14px 60px}
  .grid2,.grid3{grid-template-columns:1fr}
  .s-twocol{grid-template-columns:1fr}
  .s-twocol>div+div{border-left:0; border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>原型 v2</b><span>契约 · 形状 · 骨架</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="ctrl">
      <select id="themeSel" title="主题槽位"></select>
      <button class="icobtn" id="modeBtn" title="切换明暗">◐</button>
    </div>
  </div>
</header>
<main id="view"></main>
<footer class="foot">
  原型 v2 · 契约驱动的模块库与五类骨架。本页自身即由「内容契约 + 形状渲染器」生成；页面末尾内嵌生成它的内容草稿。
</footer>
<textarea id="am-source" hidden readonly aria-hidden="true"></textarea>
<script>
/* ============================================================
   2. 模块契约：每个模块只声明「写什么」，不声明「长什么样」
   字段：id / fam / name / shape（交给哪个形状渲染器）
        use（用途） / trigger（触发条件） / fields（必含字段）
        min（数量下限） / tier（首次出现的深度档）
   ============================================================ */
const FAMILIES = {A:'定位与概览',B:'结构与地图',C:'概念与术语',D:'叙事与演化',E:'操作与执行',F:'判断与取舍',G:'检索与索引',H:'数据与量化',I:'学习与自测',J:'元信息与延伸'};
const TIERS = {1:'一页入门',2:'全面了解',3:'深入掌握'};

const MODULES = [

function checkSpec(s){
  const ids = s.sections.map(x=>x.id), msgs=[];
  if(ids[0]!=='A1') msgs.push('首节不是 A1（当前为 '+ids[0]+'）——头部基线必须由 A1 打头。');
  const head = s.layers.head, tail = s.layers.tail;
  if(JSON.stringify(ids.slice(0,head.length))!==JSON.stringify(head))
    msgs.push('头部基线未占据最前 '+head.length+' 位：应为 '+head.join(' → ')+'。');
  if(JSON.stringify(ids.slice(-tail.length))!==JSON.stringify(tail))
    msgs.push('尾部基线未占据最后 '+tail.length+' 位：应为 '+tail.join(' → ')+'。');
  const all = new Set(ids);
  const miss = head.concat(tail).filter(x=>!all.has(x));
  if(miss.length) msgs.push('头部/尾部基线缺节：'+miss.join('、')+'。');
  const dup = ids.filter((x,i)=>ids.indexOf(x)!==i);
  if(dup.length) msgs.push('重复节：'+[...new Set(dup)].join('、')+'。');
  return {ok:msgs.length===0,msgs,head,tail,total:ids.length,
    attr:Object.keys(s.layers.attr), typeCnt:ids.length-head.length-tail.length};
}

/* ---------- 02 契约库 ---------- */
function moduleCard(m){
  const s = SHAPES[m.shape], open = state.open[m.id];
  return `<article class="mod${open?' open':''}" data-id="${m.id}">
  <div class="mod-head"><span class="mid">${m.id}</span><h3>${m.name}</h3>
    <span class="badge accent">${s?s.label:'—'}</span>
    <span class="badge">${TIERS[m.tier]}</span></div>
  <div class="kvline"><span><b>用途</b> ${m.use}</span></div>
  <div class="kvline"><span><b>触发</b> ${m.trigger}</span></div>
  <div class="kvline"><span><b>必含</b> ${m.fields}</span><span><b>下限</b> ${m.min}</span><span><b>形状</b> <code>${m.shape}</code></span></div>
  <div class="mod-foot"><button class="btn" data-toggle="${m.id}">${open?'收起':'展开渲染与草稿'}</button></div>
  <div class="mod-body">
    <p class="subttl">渲染结果（由 <code>${m.shape}</code> 渲染器生成）</p>
    ${s?s.render(s.demo):'—'}
    <p class="subttl" style="margin-top:12px">生成它的内容草稿</p>
    <pre class="draft">${esc(draftOf(m))}</pre>
  </div></article>`;
}
function draftOf(m){
  const s = SHAPES[m.shape];
  return `## ${m.id} ${m.name}\n# shape: ${m.shape}（${s?s.label:'—'}）  下限：${m.min}\n# 必含：${m.fields}\n# 触发：${m.trigger}\n# 数据语法：${s?s.syntax:''}`;
}
function renderLib(){
  const q = state.q.trim().toLowerCase();
  const list = MODULES.filter(m=>(state.fam==='ALL'||m.fam===state.fam) &&
    (!q || (m.id+m.name+m.use+m.trigger+m.fields).toLowerCase().includes(q)));
  let bar = `<div class="libbar">
    <button class="btn ${state.fam==='ALL'?'on':''}" data-fam="ALL">全部 ${MODULES.length}</button>`;
  for(const k of Object.keys(FAMILIES))
    bar += `<button class="btn ${state.fam===k?'on':''}" data-fam="${k}">${k} ${FAMILIES[k]}</button>`;
  bar += `<input type="search" id="q" placeholder="搜索模块…" value="${esc(state.q)}"></div>`;
  return `<p class="lede">模块池是备选库，不是必用清单。每一条只声明「写什么」，展开可见它由哪个形状渲染成什么样。</p>
  ${bar}<p class="note" style="margin-bottom:12px">命中 ${list.length} 条。</p>
  ${list.map(moduleCard).join('')}`;
}

/* ---------- 03 形状层 ---------- */
function renderShape(){
  const used = {};
  MODULES.forEach(m=>{ (used[m.shape] = used[m.shape]||[]).push(m.id); });
  const items = Object.keys(SHAPES).map(k=>{
    const s = SHAPES[k], ids = used[k]||[];
    return `<section class="shape-box">
    <div class="shape-h"><code>${k}</code><b>${s.label}</b>
      <span class="use">被 ${ids.length} 个模块使用 · ${ids.join(' ')}</span></div>
    <div class="shape-b"><div class="split">
      <div><p class="subttl">数据语法</p><pre class="draft">${esc(s.syntax)}</pre></div>
      <div><p class="subttl">渲染结果（下例即该形状的最小可用示例）</p>${s.render(s.demo)}</div>
    </div></div></section>`;
  }).join('');
  return `<p class="lede">${Object.keys(SHAPES).length} 个形状渲染器，承接 ${MODULES.length} 个模块的全部外观。新增模块只要落在已有形状上，就不需要写任何 CSS。</p>${items}`;
}

/* ---------- 04 五类骨架 ---------- */
function renderSk(){
  const s = SKELETONS[state.sk], spec = checkSpec(s);
  let bar = `<div class="skbar">`;
  SKELETONS.forEach((x,i)=>{ bar += `<button class="btn ${i===state.sk?'on':''}" data-sk="${i}">${x.label}</button>`; });
  bar += `<span class="sep"></span><span class="subttl" style="margin:0">深度</span>`;
  [1,2,3].forEach(d=>{ bar += `<button class="btn ${state.depth===d?'on':''}" data-depth="${d}">${TIERS[d]}</button>`; });
  bar += `<span class="sep"></span><span class="subttl" style="margin:0">主题</span>`;
  ['n','a','b','c','d','e'].forEach(t=>{ bar += `<button class="btn ${document.documentElement.dataset.theme===t?'on':''}" data-theme="${t}">${t}</button>`; });
  bar += `</div>`;
  const shown = s.sections.filter(x=>isHead(s,x.id)||isTail(s,x.id)||M(x.id).tier<=state.depth);
  const hidden = s.sections.length - shown.length;
  const secs = shown.map(x=>{
    const m = M(x.id), lay = layerOf(s,x.id), sh = SHAPES[m.shape], open = state.open['sec-'+x.id];
    return `<article class="sksec${open?' show-draft':''}">
    <div class="sksec-head">
      <span class="lay ${lay[0]}" title="${s.layers.attr[x.id]?'触发条件：'+s.layers.attr[x.id]:'基线层：'+lay[1]}">${lay[1]}</span>
      <span class="mid">${x.id}</span><h3>${x.h||m.name}</h3>
      <span class="badge accent">${m.shape}</span><span class="badge">${TIERS[m.tier]}</span>
      <span class="badge">下限 ${m.min}</span>
      <button class="btn" data-toggle="sec-${x.id}" style="margin-left:auto">${open?'看渲染':'看草稿'}</button>
    </div>
    <div class="sksec-body">${sh?sh.render(x.d):'—'}</div>
    <pre class="sksec-draft">## ${x.id} ${x.h||m.name}\n# shape: ${m.shape}  下限：${m.min}\n# 必含：${m.fields}\n${esc(JSON.stringify(x.d,null,1))}</pre>
  </article>`;
  }).join('');
  return `${bar}
  <div class="skhead">
    <h2>${s.title}</h2>
    <p class="sub">${s.sub}　默认主题槽位：<b>${s.theme}</b></p>
    <div class="spec">
      <div class="spec-line"><strong>骨架规格校验</strong>
        <span class="badge ${spec.ok?'ok':'err'}">${spec.ok?'通过':'未通过'}</span>
        <span>共 ${spec.total} 节（头部 ${spec.head.length} · 类型专属 ${spec.typeCnt} · 尾部 ${spec.tail.length}）</span></div>
      <div class="spec-line"><strong>头部基线</strong> ${spec.head.map(x=>`<code>${x}</code>`).join(' → ')}</div>
      <div class="spec-line"><strong>尾部基线</strong> ${spec.tail.map(x=>`<code>${x}</code>`).join(' → ')}</div>
      <div class="spec-line"><strong>属性触发</strong> ${spec.attr.length?spec.attr.map(x=>`<code>${x}</code>（${s.layers.attr[x]}）`).join('　'):'—'}</div>
      ${spec.msgs.map(m=>`<p class="spec-msg">✗ ${m}</p>`).join('')}
      <span class="spec-meta">当前深度档「${TIERS[state.depth]}」显示 ${shown.length} 节${hidden>0?`，另有 ${hidden} 节属于更深的档位`:'；基线层在任何档位都保留'}。</span>
    </div>
  </div>${secs}`;
}

function lintDraft(text){
  const lines = text.split('\n'), secs = [];
  lines.forEach((ln,i)=>{
    const m = ln.match(/^##\s+(\S+)\s*(.*)$/);
    if(m) secs.push({line:i+1,id:m[1],title:m[2].trim(),items:[]});
    else if(secs.length && /^\s*-\s+/.test(ln)) secs[secs.length-1].items.push(ln.replace(/^\s*-\s+/,''));
  });
  const errs = [];
  secs.forEach(s=>{
    const mod = MODULES.find(x=>x.id===s.id);
    if(!mod){
      errs.push({line:s.line,id:s.id,name:s.title,
        msg:`模块池中不存在 ID「${s.id}」`,
        fix:`可用的 ID 形如 A1 A2 A6 B1 C2 E8 I1 I5 J5，请核对模块池。`});
      return;
    }
    const need = minNum(mod.min), got = s.items.length;
    if(need && got < need && ['bullets','chips','checklist','terms','cards','qa','steps','timeline'].indexOf(mod.shape)>=0)
      errs.push({line:s.line,id:s.id,name:mod.name,
        msg:`条目数 ${got}，低于下限 ${mod.min}`,
        fix:`## ${s.id} ${mod.name}\n` + Array.from({length:need},(_,i)=>`- ${['第 '+(i+1)+' 条结论','示例条目'][i%2]||'条目'}`).join('\n')});
  });
  const ids = secs.map(s=>s.id);
  if(ids.length){
    if(ids[0]!=='A1')
      errs.push({line:secs[0].line,id:secs[0].id,name:secs[0].title,
        msg:'首节必须是一句话定位 A1，头部基线由它打头',
        fix:`## A1 一句话定位\n这一页讲什么、解决什么问题。`});
    const tail = ['E8','I1','I5','J9','J10','J5'], present = ids.filter(x=>tail.indexOf(x)>=0);
    const sorted = present.slice().sort((a,b)=>tail.indexOf(a)-tail.indexOf(b));
    if(present.join('|')!==sorted.join('|'))
      errs.push({line:secs[present.length?ids.indexOf(present[0]):0].line,id:'—',name:'尾部基线',
        msg:'尾部基线顺序错：应为 '+tail.join(' → '),
        fix:`尾部基线固定顺序：\n${tail.join('\n')}`});
  }
  return {secs,errs};
}
function renderLint(){
  return `<p class="lede">校验器不做审稿，只做契约核对：ID 是否存在、必含字段与数量下限是否满足、基线层位置与顺序是否正确。错误按「行号 + 模块 + 原因 + 正确写法」返回。</p>
  <div class="presets">
    <button class="btn" data-preset="ok">载入：正确样板</button>
    <button class="btn" data-preset="few">载入：条目数不足</button>
    <button class="btn" data-preset="unknown">载入：未知模块</button>
    <button class="btn" data-preset="order">载入：基线层顺序错</button>
  </div>
  <textarea class="draft-input" id="lintIn" spellcheck="false">${esc(PRESETS.ok)}</textarea>
  <p style="margin:10px 0"><button class="btn on" id="lintRun">运行校验</button></p>
  <div class="report" id="lintOut"></div>`;
}
function runLint(){
  const r = lintDraft($('lintIn').value);
  if(!r.errs.length){
    $('lintOut').innerHTML = `<p class="ln ok">✓ 检查通过 · ${r.secs.length} 节 · 未发现契约违规</p>`;
    return;
  }
  $('lintOut').innerHTML = r.errs.map(e=>
    `<p class="ln">✗ L${e.line} [${e.id} ${e.name}] ${e.msg}</p><pre class="fix">Correct example:\n${esc(e.fix)}</pre>`
  ).join('') + `<p class="ln ok">✓ 其余 ${r.secs.length} 节通过</p>`;
}

/* ---------- 壳 ---------- */
function render(){
  $('tabs').innerHTML = TABS.map(t=>`<button class="tab ${state.tab===t.id?'on':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  const v = $('view');
  if(state.tab==='diff') v.innerHTML = renderDiff();
  else if(state.tab==='lib') v.innerHTML = renderLib();
  else if(state.tab==='shape') v.innerHTML = renderShape();
  else if(state.tab==='sk') v.innerHTML = renderSk();
  else { v.innerHTML = renderLint(); }
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tab],[data-fam],[data-toggle],[data-sk],[data-depth],[data-theme],[data-preset],#lintRun');
  if(!t) return;
  if(t.dataset.tab){ state.tab=t.dataset.tab; render(); return; }
  if(t.dataset.fam){ state.fam=t.dataset.fam; render(); return; }
  if(t.dataset.sk){ state.sk=+t.dataset.sk; render(); return; }
  if(t.dataset.depth){ state.depth=+t.dataset.depth; render(); return; }
  if(t.dataset.theme){ document.documentElement.dataset.theme=t.dataset.theme; render(); return; }
  if(t.dataset.preset){ $('lintIn').value = PRESETS[t.dataset.preset]; runLint(); return; }
  if(t.id==='lintRun'){ runLint(); return; }
  if(t.dataset.toggle){ const k=t.dataset.toggle; state.open[k]=!state.open[k]; render(); return; }
});
document.addEventListener('input', e=>{ if(e.target.id==='q'){ state.q=e.target.value; render(); const q=$('q'); if(q){q.focus(); q.setSelectionRange(q.value.length,q.value.length);} } });

$('themeSel').innerHTML = Object.keys(THEMES).map(k=>`<option value="${k}">${THEMES[k]}</option>`).join('');
$('themeSel').onchange = e=>{ document.documentElement.dataset.theme = e.target.value; render(); };

render();
